name: tracegenie-community-source
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: community
      POSTGRES_PASSWORD: ${COMMUNITY_DB_PASSWORD:?Run npm run setup}
      POSTGRES_DB: community
    ports: ["127.0.0.1:54383:5432"]
    volumes: ["community_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community -d community"]
      interval: 2s
      timeout: 3s
      retries: 30
  mail:
    image: axllent/mailpit:v1.27.8
    ports: ["127.0.0.1:11325:1025", "127.0.0.1:14325:8025"]
volumes:
  community_data:
