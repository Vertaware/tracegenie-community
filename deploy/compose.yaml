name: ${COMPOSE_PROJECT_NAME:?Run ./tracegenie install first}
services:
  community:
    image: ${COMMUNITY_IMAGE:?Choose a release image}
    restart: unless-stopped
    stop_grace_period: 240s
    env_file: .env
    ports:
      - "${BIND_ADDRESS}:${HTTP_PORT}:8080"
      - "${BIND_ADDRESS}:${HTTPS_PORT}:8443"
    volumes:
      - community_data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  community_data:
