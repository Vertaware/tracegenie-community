name: ${COMPOSE_PROJECT_NAME:?Run ./tracegenie install first}
x-runtime: &runtime
  image: ${COMMUNITY_IMAGE:?Choose a release image}
  init: true
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    SERVE_WEB: "true"
    API_HOST: 0.0.0.0
    API_PORT: "4310"
    DATABASE_URL: postgresql://community:${COMMUNITY_DB_PASSWORD}@postgres:5432/community
    API_BASE_URL: ${PUBLIC_URL}
    ADMIN_APP_URL: ${PUBLIC_URL}
    DEMO_APP_URL: ${PUBLIC_URL}/feedback/
    CORS_ORIGINS: ${PUBLIC_URL}
    PUBLIC_APP_ORIGINS: ${PUBLIC_URL}
    TRUST_PROXY_HOPS: "1"
    STORAGE_LOCAL_ROOT: /data/uploads
  volumes:
    - uploads:/data/uploads
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: community
      POSTGRES_DB: community
      POSTGRES_PASSWORD: ${COMMUNITY_DB_PASSWORD:?Run ./tracegenie install first}
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community -d community"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    <<: *runtime
    restart: "no"
    profiles: ["maintenance"]
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy", "--schema", "apps/api/prisma/schema.prisma"]
  app:
    <<: *runtime
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
  worker:
    <<: *runtime
    command: ["node", "apps/api/dist/worker.js"]
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');process.exit(Date.now()-fs.statSync('/tmp/tracegenie-worker-ready').mtimeMs<60000?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    depends_on:
      app: { condition: service_healthy }
    ports:
      - "${BIND_ADDRESS}:${HTTP_PORT}:80"
      - "${BIND_ADDRESS}:${HTTPS_PORT}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
volumes:
  database:
  uploads:
  certificates:
  caddy_config:
