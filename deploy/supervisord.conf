[unix_http_server]
file=/run/tracegenie/supervisor.sock
chmod=0600

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/tracegenie/supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/tracegenie/supervisor.sock

[program:postgres]
command=/usr/local/bin/docker-entrypoint.sh postgres -c listen_addresses=127.0.0.1
priority=10
autorestart=true
startsecs=3
startretries=3
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:app]
command=/app/deploy/run-service app
directory=/app
user=node
priority=20
autostart=%(ENV_TRACEGENIE_WEB_AUTOSTART)s
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/app/deploy/run-service worker
directory=/app
user=node
priority=30
autostart=%(ENV_TRACEGENIE_WEB_AUTOSTART)s
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gateway]
command=/usr/local/bin/caddy run --config /app/deploy/Caddyfile --adapter caddyfile
directory=/app
user=node
priority=40
autostart=%(ENV_TRACEGENIE_WEB_AUTOSTART)s
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[include]
files=/etc/supervisor/conf.d/*.conf
